<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpsDesk API — Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #f8fafc; }
    header { background: #101828; color: white; padding: 18px 24px; font: 600 18px system-ui; }
    header span { color: #93c5fd; font-weight: normal; }
  </style>
</head>
<body>
  <header>OpsDesk API <span>· OpenAPI 3.0 · Laravel + PostgreSQL</span></header>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.addEventListener('load', function () {
      SwaggerUIBundle({url:'/openapi.yaml', dom_id:'#swagger-ui', deepLinking:true, persistAuthorization:false});
    });
  </script>
</body>
</html>
